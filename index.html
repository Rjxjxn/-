0917-64674bd600d8?auto=format&fit=crop&w=800&q=80','kokusai':'https://images.unsplash.com/photo-1582656914563-7188b8e0b62e?auto=format&fit=crop&w=800&q=80','beer':'https://images.unsplash.com/photo-1575425186775-b8de9a427e67?auto=format&fit=crop&w=800&q=80','pizza':'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=800&q=80'}; return m[k]||m['default'];}

        // --- Renderers (HTML) ---

></i> 刪除</button></div></div>`:''}`;

        function renderSplit(c) {

            if(amount && targets.length > 0) {
                const perPerson = Math.round(parseFloat(amount) / targets.length);
                const symbol = curr === 'TWD' ? 'NT$' : '¥';
                const displayAmt = `${symbol}${perPerson.toLocaleString()}`;
                const payer = window.state.users.find(u => u.id === payerId);
                const debtors = targets.filter(uid => uid !== payerId);
                
                let detailHtml = '';
                if(debtors.length === 0) {
                     detailHtml = `<div class="text-xs text-slate-300 mb-2">完全由 ${payer.name} 自己負擔</div>`;
                } else {
                     detailHtml = debtors.map(uid => {
                        const u = users.find(x => x.id === uid);
                        return `<div class="flex justify-between text-xs text-slate-300 border-b border-amber-700/30 pb-1 mb-1"><span>${u.name} 給 ${payer.name}</span><span class="font-bold text-amber-200">${symbol}${perPerson.toLocaleString()}</span></div>`;
                     }).join('');
                }

                resultHtml = `<div id="split-result-area" class="bg-amber-900/40 border border-amber-600/50 rounded-xl p-4 mt-4 animate-in fade-in"><div class="text-center mb-1 text-amber-200 text-xs">總金額 ${symbol}${amount.toLocaleString()} / ${targets.length}人</div><div class="text-center text-2xl font-bold text-white mb-3">每人分擔 ${displayAmt}</div><div class="bg-black/20 rounded p-2 mb-3 space-y-1">${detailHtml}</div><button onclick="window.submitSplitToAccounting(${perPerson})" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-3 rounded-lg font-bold shadow-lg flex items-center justify-center gap-2 transition-transform active:scale-95"><i data-lucide="save" width="18"></i> 寫入記帳</button></div>`;
            } else {
                resultHtml = `<div id="split-result-area"><div class="text-center text-slate-500 text-sm py-4">輸入金額並選擇分帳對象...</div></div>`;
            }

            const isSplitJpy = window.state.splitCurrency === 'JPY';

            c.innerHTML = `
                <div class="bg-[#1e293b] rounded-xl p-5 border border-slate-700 shadow-md">
                    <h2 class="text-amber-400 text-sm font-bold uppercase mb-4 flex items-center gap-2"><i data-lucide="calculator" width="16"></i> 分帳計算機</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">總金額</label>
                            <div class="flex gap-2">
                                <input type="number" id="split-amount-input" value="${amount}" oninput="window.updateSplitCalc(this.value)" class="w-2/3 bg-slate-900 border border-slate-600 rounded-lg p-3 text-xl text-white text-center focus:border-amber-500 outline-none" placeholder="0">
                                <div class="w-1/3 flex bg-slate-800 rounded-lg border border-slate-600 p-1">
                                    <button onclick="window.setSplitCurrency('JPY')" class="flex-1 text-xs rounded ${isSplitJpy?'bg-amber-600 text-white':'text-slate-400'}">日幣</button>
                                    <button onclick="window.setSplitCurrency('TWD')" class="flex-1 text-xs rounded ${!isSplitJpy?'bg-indigo-600 text-white':'text-slate-400'}">台幣</button>
                                </div>
                            </div>
                        </div>
                        <div><label class="text-xs text-slate-400 mb-2 block">誰先墊錢？</label><div class="flex gap-2">${users.map(u => `<button onclick="window.setSplitPayer('${u.id}')" class="flex-1 py-2 rounded-lg text-xs transition-all ${payerId===u.id ? `${u.color} text-white ring-2 ring-white` : 'bg-slate-800 text-slate-400 border border-slate-600'}">${u.name}</button>`).join('')}</div></div>
                        <div><label class="text-xs text-slate-400 mb-2 block">分給誰？ (點擊選擇)</label><div class="grid grid-cols-2 gap-2">${users.map(u => { const isSelected = targets.includes(u.id); return `<button onclick="window.toggleSplitTarget('${u.id}')" class="py-2 rounded-lg text-xs transition-all flex items-center justify-center gap-2 ${isSelected ? 'bg-slate-600 text-white border border-amber-500' : 'bg-slate-800 text-slate-500 border border-slate-700'}"><div class="w-2 h-2 rounded-full ${u.color}"></div> ${u.name} ${isSelected?'✓':''}</button>`; }).join('')}</div></div>
                    </div>
                    ${resultHtml}
                </div>
            `;
        }

        function renderAccounting(c) {
            const tj = window.state.expenses.reduce((s,i)=>s+i.amount,0);
            const tt = Math.round(tj/window.state.rate);
            const mh = `<div class="grid grid-cols-4 gap-2 mb-6">${window.state.users.map(u => `<div onclick="window.renameUser('${u.id}')" class="flex flex-col items-center gap-1 cursor-pointer group"><div class="w-10 h-10 rounded-full ${u.color} flex items-center justify-center text-white font-bold shadow-md">${u.name.charAt(0)}</div><div class="flex items-center gap-1"><span class="text-[10px] text-slate-300">${u.name}</span><i data-lucide="edit-3" width="8" class="text-slate-500"></i></div></div>`).join('')}</div>`;
            const sh = `<div class="bg-[#1e293b] rounded-2xl p-4 border border-slate-700 shadow-md mb-6"><h2 class="text-emerald-400 text-xs font-bold uppercase mb-3 flex items-center gap-1"><i data-lucide="pie-chart" width="14"></i> 支出總覽</h2><div class="mb-4 text-center"><span class="text-3xl font-bold text-white">¥${tj.toLocaleString()}</span><div class="text-xs text-slate-400">約 NT$ ${tt.toLocaleString()}</div></div><div class="grid grid-cols-2 gap-2">${window.state.users.map(u => { const ut = window.state.expenses.filter(e=>e.userId===u.id).reduce((s,e)=>s+e.amount,0); return `<div class="bg-slate-800/50 rounded p-2 flex items-center justify-between border border-slate-700/50"><div class="flex items-center gap-1.5"><div class="w-2 h-2 rounded-full ${u.color}"></div><span class="text-xs text-slate-300">${u.name}</span></div><span class="text-xs font-mono font-bold ${u.text}">¥${ut.toLocaleString()}</span></div>`; }).join('')}</div></div>`;

            const catsHtml = EXPENSE_CATEGORIES.map(c => `
                <button type="button" onclick="window.setExpCat('${c.id}')" class="flex flex-col items-center gap-1 py-2 rounded-lg transition-all ${window.tempExpCat === c.id ? 'bg-slate-700 text-emerald-400 ring-1 ring-emerald-500' : 'text-slate-500 hover:bg-slate-800'}">
                    <div class="${c.color} text-white p-1.5 rounded-full shadow-sm"><i data-lucide="${c.icon}" width="18"></i></div>
                    <span class="text-[10px]">${c.name}</span>
                </button>
            `).join('');

            const isJpy = window.tempExpCurr === 'JPY';
            const fh = `<div class="bg-[#1e293b] rounded-xl p-4 border border-slate-700 shadow-md mb-6"><h3 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2"><i data-lucide="credit-card" width="16"></i> 新增消費</h3><form onsubmit="window.submitExpense(event)" class="space-y-4"><div class="flex gap-2 justify-between bg-slate-800 p-1.5 rounded-lg border border-slate-600">${window.state.users.map(u=>`<button type="button" onclick="window.selectUser('${u.id}')" class="flex-1 py-1.5 text-xs rounded transition-all flex justify-center items-center gap-1 ${window.state.selectedUser===u.id?`${u.color} text-white shadow-sm`:'text-slate-400'}">${u.name}</button>`).join('')}</div><div class="flex gap-2"><div class="relative w-2/3"><input type="number" id="exp-amount" placeholder="0" value="${window.state.formAmount}" oninput="window.syncAmount(this.value)" class="w-full bg-slate-800 border border-slate-600 rounded-lg py-2.5 pl-3 pr-12 text-lg text-white font-mono focus:border-emerald-500 outline-none"><span class="absolute right-3 top-3 text-xs text-slate-400" id="exp-curr-label">${window.tempExpCurr}</span></div><div class="w-1/3 flex bg-slate-800 rounded-lg border border-slate-600 p-1"><button type="button" onclick="window.setExpCurr('JPY')" class="flex-1 text-xs rounded ${isJpy?'bg-emerald-600 text-white':'text-slate-400'}">日幣</button><button type="button" onclick="window.setExpCurr('TWD')" class="flex-1 text-xs rounded ${!isJpy?'bg-indigo-600 text-white':'text-slate-400'}">台幣</button></div></div><div class="grid grid-cols-6 gap-2" id="cat-grid">${catsHtml}</div><div class="flex gap-2"><input type="text" id="exp-note" placeholder="備註" value="${window.state.formNote}" oninput="window.syncNote(this.value)" class="grow bg-slate-800 border border-slate-600 rounded-lg px-3 text-sm text-white focus:border-emerald-500 outline-none"><button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white p-2.5 rounded-lg shadow-lg"><i data-lucide="plus" width="20"></i></button></div></form></div>`;
            
            const lh = `<h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider pl-1 mb-3">最近紀錄 (點擊展開)</h3><div class="space-y-3">${window.state.expenses.length===0 ? `<div class="text-center py-8 text-slate-600 text-sm">尚無紀錄</div>` : window.state.expenses.map(i => { 
                const cat=EXPENSE_CATEGORIES.find(c=>c.id===i.cat)||EXPENSE_CATEGORIES[0]; 
                const u=window.state.users.find(x=>x.id===i.userId)||window.state.users[0]; 
                const isEx = window.state.expandedExpenseId === i.id;
                return `<div onclick="window.toggleExpandExpense('${i.id}')" class="bg-[#1e293b] border ${u.border} border-l-4 rounded-lg shadow-sm fade-in transition-all cursor-pointer overflow-hidden"><div class="p-3 flex items-center gap-3"><div class="shrink-0 ${cat.color} text-white p-2 rounded-full"><i data-lucide="${cat.icon}" width="18"></i></div><div class="grow min-w-0"><div class="flex justify-between items-baseline"><span class="font-bold text-slate-200 ${isEx ? '' : 'truncate'}">${i.note||cat.name}</span><span class="font-mono font-bold text-white ml-2">¥${i.amount.toLocaleString()}</span></div><div class="flex justify-between items-center mt-1"><span class="text-[10px] px-1.5 rounded bg-slate-800 ${u.text}">${u.name}</span><div class="flex items-center gap-1"><span class="text-[10px] text-slate-500">≈ NT$ ${Math.round(i.amount/window.state.rate)}</span><i data-lucide="${isEx?'chevron-up':'chevron-down'}" width="14" class="text-slate-500"></i></div></div></div></div>${isEx ? `<div class="px-3 pb-3 pt-0 border-t border-slate-700/50 bg-slate-800/20 animate-in slide-in-from-top-1"><div class="mt-2 text-xs text-slate-400 space-y-1"><div class="flex justify-between"><span>分類:</span> <span>${cat.name}</span></div><div class="flex justify-between"><span>時間:</span> <span>${new Date(i.timestamp).toLocaleString()}</span></div><div class="pt-2 text-sm text-slate-300 whitespace-pre-wrap border-t border-slate-700/30 mt-2">${i.note || '(無備註)'}</div></div><div class="mt-3 flex justify-end"><button onclick="event.stopPropagation(); window.deleteCloudExpense('${i.id}')" class="text-xs bg-red-900/30 text-red-400 hover:bg-red-900/50 px-3 py-1.5 rounded border border-red-900/50 flex items-center gap-1 transition-colors"><i data-lucide="trash-2" width="14"></i> 刪除此紀錄</button></div></div>` : ''}</div>`; 
            }).join('')}</div>`;
            c.innerHTML = mh + sh + fh + lh;
        }

        // --- Handlers ---
        window.toggleExpand=(id)=>{window.state.expandedId=window.state.expandedId===id?null:id;renderContent();}
        window.toggleExpandExpense=(id)=>{window.state.expandedExpenseId=window.state.expandedExpenseId===id?null:id;renderContent();lucide.createIcons();}
        window.selectUser=(id)=>{window.state.selectedUser=id;renderContent();}
        window.setRecommendFilter=(f)=>{window.state.recommendFilter=f;renderContent();}
        window.setExpCurr=(c)=>{window.tempExpCurr=c;renderContent();}
        window.setExpCat=(c)=>{window.tempExpCat=c;renderContent();}
        window.syncAmount=(v)=>{window.state.formAmount=v;}
        window.syncNote=(v)=>{window.state.formNote=v;}
        window.submitExpense=(e)=>{e.preventDefault();const a=window.state.formAmount,n=window.state.formNote;if(!a){alert("請輸入金額");return;}let v=parseFloat(a);if(window.tempExpCurr==='TWD')v=Math.round(v*window.state.rate);window.addCloudExpense({amount:v,cat:window.tempExpCat,note:n,userId:window.state.selectedUser});window.state.formAmount='';window.state.formNote='';renderContent();}
        window.deleteCloudExpense=(id)=>{if(confirm("刪除?"))window.expensesRef.doc(id).delete();}
        window.renameUser=(id)=>{const u=window.state.users.find(x=>x.id===id),n=prompt("新暱稱:",u.name);if(n){const l=window.state.users.map(x=>x.id===id?{...x,name:n}:x);window.updateCloudUser(l);}}
        window.toggleConverter=()=>{document.getElementById('converter-panel').classList.toggle('hidden');}
        window.convertCurrency=(t)=>{const j=document.getElementById('conv-jpy'),tw=document.getElementById('conv-twd');if(t==='jpy')tw.value=j.value?Math.round(j.value/window.state.rate):'';else j.value=tw.value?Math.round(tw.value*window.state.rate):'';}
        window.showAddItin=(d)=>{window.state.isAddingItinerary=d;renderContent();}
        window.cancelAddItin=()=>{window.state.isAddingItinerary=null;renderContent();}
        window.submitItinerary=(e,d)=>{e.preventDefault();const f=new FormData(e.target);window.addCloudItineraryEvent(d,{time:f.get('time'),title:f.get('title'),note:f.get('note'),cost:f.get('cost'),mapUrl:f.get('title'),imgKey:'default'});window.state.isAddingItinerary=null;renderContent();}
        window.deleteCloudItin=(id)=>{if(confirm("刪除?"))window.itineraryRef.doc(id).delete();}
        window.showAddBackup=()=>{window.state.isAddingBackup=true;renderContent();}
        window.cancelAddBackup=()=>{window.state.isAddingBackup=false;renderContent();}
        window.submitBackup=(e)=>{e.preventDefault();const f=new FormData(e.target);window.addCloudBackupEvent({title:f.get('title'),tag:f.get('tag'),note:f.get('note')});window.state.isAddingBackup=false;renderContent();}
        window.deleteCloudBackup=(id)=>{if(confirm("刪除?"))window.backupRef.doc(id).delete();}
        window.addToBackupFromRec=(t,g,n)=>{if(confirm(`加入「${t}」?`))window.addCloudBackupEvent({title:t,tag:g,note:n});}
        window.addToItinFromBackup=(id,t,n)=>{const d=prompt("第幾天(1-6)?");if(!d)return;const di=parseInt(d)-1;const tm=prompt("時間?","10:00");if(!tm)return;window.addCloudItineraryEvent(di,{time:tm,title:t,note:n,cost:"",mapUrl:t,imgKey:'default'});if(confirm("從備案移除?"))window.backupRef.doc(id).delete();}
        window.uploadDefaultItinerary=async()=>{if(!confirm("上傳?"))return;const b=window.db.batch();window.DEFAULT_ITINERARY_EVENTS_SOURCE.forEach(d=>{d.events.forEach(e=>{const r=window.itineraryRef.doc();b.set(r,{...e,dayIndex:d.dayIndex,timestamp:Date.now()});});});b.commit().then(()=>alert("完成!"));}
        window.updateSplitCalc=(v)=>{window.state.splitAmount=v;renderContent();const e=document.getElementById('split-amount-input');if(e)e.focus();}
        window.setSplitPayer=(id)=>{window.state.splitPayer=id;if(!window.state.splitTargets.includes(id))window.state.splitTargets.push(id);renderContent();const e=document.getElementById('split-amount-input');if(e){e.value=window.state.splitAmount;e.focus();window.updateSplitCalc(e.value);}}
        window.toggleSplitTarget=(id)=>{const i=window.state.splitTargets.indexOf(id);if(i>-1)window.state.splitTargets.splice(i,1);else window.state.splitTargets.push(id);renderContent();const e=document.getElementById('split-amount-input');if(e){e.value=window.state.splitAmount;e.focus();window.updateSplitCalc(e.value);}}
        window.setSplitCurrency=(c)=>{window.state.splitCurrency=c;renderContent();const e=document.getElementById('split-amount-input');if(e){e.value=window.state.splitAmount;e.focus();window.updateSplitCalc(e.value);}}
        window.submitSplitToAccounting=(pp)=>{if(confirm('寫入記帳？')){const payer=window.state.users.find(u=>u.id===window.state.splitPayer);const tgs=window.state.users.filter(u=>window.state.splitTargets.includes(u.id)).map(u=>u.name).join(', ');let val=parseFloat(window.state.splitAmount);const c=window.state.splitCurrency;const s=c==='TWD'?`NT$${pp}`:`¥${pp}`;let note=`分帳: 總額${c==='TWD'?'NT$':'¥'}${val} (每人${s})`;if(c==='TWD')val=Math.round(val*window.state.rate);window.addCloudExpense({amount:val,cat:'food',note:note,userId:window.state.splitPayer});window.state.splitAmount='';alert("完成!");renderContent();}}
        window.exportCSV = function() {
            if(window.state.expenses.length === 0) { alert("沒有記帳資料可匯出"); return; }
            let csvContent = "\uFEFF";
            csvContent += "日期,付款人,類別,金額(JPY),台幣約(TWD),備註\n";
            window.state.expenses.forEach(e => {
                const date = new Date(e.timestamp).toLocaleDateString();
                const user = window.state.users.find(u => u.id === e.userId)?.name || 'Unknown';
                const cat = EXPENSE_CATEGORIES.find(c => c.id === e.cat)?.name || '其他';
                const twd = Math.round(e.amount / window.state.rate);
                const note = e.note ? `"${e.note.replace(/"/g, '""')}"` : "";
                csvContent += `${date},${user},${cat},${e.amount},${twd},${note}\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "沖繩記帳_2026.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function addCloudExpense(d){if(window.db)await window.expensesRef.add({...d,timestamp:Date.now()});}
        async function updateCloudUser(l){if(window.db)await window.usersRef.set({list:l});}
        async function addCloudItineraryEvent(d,v){if(window.db)await window.itineraryRef.add({...v,dayIndex:d});}
        async function addCloudBackupEvent(v){if(window.db)await window.backupRef.add({...v,timestamp:Date.now()});}
        async function deleteCloudItin(id){if(window.db)await window.itineraryRef.doc(id).delete();}
        async function deleteCloudBackup(id){if(window.db)await window.backupRef.doc(id).delete();}
        async function deleteCloudExpense(id){if(window.db)await window.expensesRef.doc(id).delete();}
    </script>
</body>
</html>
