<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 沖繩旅遊小秘書 (V26)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #loading-screen { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: opacity 0.5s; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 font-sans pb-24 selection:bg-indigo-500">

    <!-- Loading -->
    <div id="loading-screen">
        <div class="animate-spin text-emerald-500 mb-4"><i data-lucide="loader-2" width="48" height="48"></i></div>
        <div class="text-slate-400 text-sm" id="loading-text">系統啟動中...</div>
        <button onclick="forceStart()" id="force-btn" class="mt-6 text-xs text-slate-500 border border-slate-700 px-3 py-1 rounded hover:text-white hidden">強制進入</button>
    </div>

    <!-- Header -->
    <div class="bg-[#1e293b]/95 backdrop-blur-md shadow-lg sticky top-0 z-30 border-b border-indigo-500/30">
        <div class="max-w-3xl mx-auto px-4 py-3">
            <div class="flex justify-between items-center mb-2">
                <div>
                    <h1 id="app-title" class="text-lg md:text-2xl font-bold flex items-center gap-2 text-white">
                        <i data-lucide="moon" class="text-yellow-300" width="20"></i> 2026 沖繩行
                    </h1>
                    <div class="flex items-center gap-3 mt-1">
                        <span id="weather-widget" class="text-[10px] flex items-center gap-1 text-slate-300 bg-slate-800/80 px-2 py-0.5 rounded-full border border-slate-600 hidden"></span>
                        <span id="cloud-status" class="text-[10px] flex items-center gap-1 transition-colors text-slate-500">
                            <div class="w-2 h-2 rounded-full bg-slate-500"></div> 連線中...
                        </span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="app.exportCSV()" class="p-2 rounded-full bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white transition-all hidden" id="btn-export"><i data-lucide="download" width="18"></i></button>
                    <button onclick="app.toggleConverter()" class="p-2 rounded-full bg-slate-800 text-slate-400 hover:bg-slate-700 transition-all"><i data-lucide="calculator" width="18"></i></button>
                </div>
            </div>
            <div id="converter-panel" class="hidden bg-slate-800/80 rounded-lg p-3 border border-slate-600 mt-2 fade-in">
                <div class="flex items-center gap-2">
                    <div class="relative flex-1"><span class="absolute left-2 top-2 text-xs text-slate-400">🇯🇵 JPY</span><input type="number" id="conv-jpy" oninput="app.convertCurrency('jpy')" class="w-full bg-slate-900 border border-slate-600 rounded p-1.5 pt-6 text-white text-right focus:outline-none focus:border-indigo-500"></div>
                    <i data-lucide="arrow-right-left" class="text-slate-500" width="16"></i>
                    <div class="relative flex-1"><span class="absolute left-2 top-2 text-xs text-slate-400">🇹🇼 TWD</span><input type="number" id="conv-twd" oninput="app.convertCurrency('twd')" class="w-full bg-slate-900 border border-slate-600 rounded p-1.5 pt-6 text-white text-right focus:outline-none focus:border-emerald-500"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div id="main-content" class="max-w-3xl mx-auto px-3 py-4 space-y-5 fade-in"></div>

    <!-- Footer -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#1e293b]/95 backdrop-blur-md border-t border-slate-700 pb-safe z-40">
        <div class="flex justify-around max-w-3xl mx-auto">
            <button onclick="app.switchTab('itinerary')" id="tab-itinerary" class="flex-1 py-4 flex flex-col items-center gap-1 text-[10px] font-medium transition-colors text-indigo-400"><i data-lucide="calendar" width="24"></i> 行程</button>
            <div class="w-px bg-slate-700 my-3 opacity-50"></div>
            <button onclick="app.switchTab('backup')" id="tab-backup" class="flex-1 py-4 flex flex-col items-center gap-1 text-[10px] font-medium transition-colors text-slate-500"><i data-lucide="folder-plus" width="24"></i> 備案</button>
            <div class="w-px bg-slate-700 my-3 opacity-50"></div>
            <button onclick="app.switchTab('recommend')" id="tab-recommend" class="flex-1 py-4 flex flex-col items-center gap-1 text-[10px] font-medium transition-colors text-slate-500"><i data-lucide="thumbs-up" width="24"></i> 推薦</button>
            <div class="w-px bg-slate-700 my-3 opacity-50"></div>
            <button onclick="app.switchTab('split')" id="tab-split" class="flex-1 py-4 flex flex-col items-center gap-1 text-[10px] font-medium transition-colors text-slate-500"><i data-lucide="divide-square" width="24"></i> 分帳</button>
            <div class="w-px bg-slate-700 my-3 opacity-50"></div>
            <button onclick="app.switchTab('accounting')" id="tab-accounting" class="flex-1 py-4 flex flex-col items-center gap-1 text-[10px] font-medium transition-colors text-slate-500"><i data-lucide="wifi" width="24"></i> 記帳</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 安全啟動機制
        // ==========================================
        window.forceStart = function() {
            const l = document.getElementById('loading-screen');
            if(l) { l.style.opacity='0'; setTimeout(()=>l.style.display='none',500); }
            app.renderAll();
        };
        setTimeout(() => {
            const btn = document.getElementById('force-btn');
            if(btn) btn.classList.remove('hidden');
            // 自動嘗試移除
            if(window.app && window.app.state) window.forceStart();
        }, 3000);

        // ==========================================
        // 應用程式核心 (Namespace: app)
        // ==========================================
        window.app = {
            state: {
                activeTab: 'itinerary',
                itineraryEvents: [],
                backupEvents: [],
                expenses: [],
                users: [],
                rate: 4.65,
                expandedId: null,
                expandedExpId: null,
                selectedUser: 'u1',
                isAddingItinerary: null,
                isAddingBackup: false,
                recommendFilter: '全部',
                formAmount: '', formNote: '', // 記帳暫存
                splitAmount: '', splitPayer: 'u1', splitTargets: [], splitCurrency: 'JPY' // 分帳暫存
            },
            tempExpCat: 'food',
            tempExpCurr: 'JPY', // 記帳頁面幣別

            // Firebase Config
            firebaseConfig: {
              apiKey: "AIzaSyBvclnyKUkCUzyBnGljSMsg38DfgroRDxg",
              authDomain: "okinawaonline-64b20.firebaseapp.com",
              projectId: "okinawaonline-64b20",
              storageBucket: "okinawaonline-64b20.firebasestorage.app",
              messagingSenderId: "457339726484",
              appId: "1:457339726484:web:686abfc9820d6d9c4b2281",
              measurementId: "G-7XV7V6QXBV"
            },

            // 初始化
            init: function() {
                try {
                    if(typeof firebase !== 'undefined') {
                        firebase.initializeApp(this.firebaseConfig);
                        window.db = firebase.firestore();
                        window.usersRef = db.collection("config").doc("users");
                        window.expensesRef = db.collection("expenses");
                        window.itineraryRef = db.collection("itinerary_events");
                        window.backupRef = db.collection("backup_events");
                        this.initListeners();
                    }
                } catch(e) { console.error(e); }

                fetch('https://api.exchangerate-api.com/v4/latest/TWD').then(r=>r.json()).then(d=>{if(d?.rates?.JPY) this.state.rate=d.rates.JPY; this.renderHeader();}).catch(()=>{});
                this.fetchWeather();
                this.renderAll();
            },

            initListeners: function() {
                const us = (ok) => {
                    const el = document.getElementById('cloud-status');
                    if(el) {
                        el.innerHTML = ok ? `<div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div> 雲端已連線` : `<div class="w-2 h-2 rounded-full bg-red-500"></div> 連線中斷`;
                        el.className = ok ? "text-[10px] flex items-center gap-1 transition-colors text-emerald-500" : "text-[10px] flex items-center gap-1 text-red-500";
                    }
                };

                // 關鍵：資料更新時，只更新數據，不強制重繪「正在輸入」的頁面
                expensesRef.orderBy("timestamp", "desc").onSnapshot(s => { 
                    let l=[]; s.forEach(d=>l.push({id:d.id,...d.data()})); 
                    this.state.expenses=l; 
                    if(this.state.activeTab === 'accounting' && document.activeElement.tagName !== 'INPUT') this.renderContent();
                    us(true); 
                }, ()=>us(false));

                itineraryRef.onSnapshot(s => { 
                    let l=[]; s.forEach(d=>l.push({id:d.id,...d.data()})); 
                    this.state.itineraryEvents=l; 
                    if(this.state.activeTab === 'itinerary') this.renderContent();
                });

                backupRef.orderBy("timestamp", "desc").onSnapshot(s => { 
                    let l=[]; s.forEach(d=>l.push({id:d.id,...d.data()})); 
                    this.state.backupEvents=l; 
                    if(this.state.activeTab === 'backup') this.renderContent();
                });

                usersRef.onSnapshot(s => { 
                    if(s.exists) {
                        this.state.users=s.data().list;
                        if(this.state.splitTargets.length===0) this.state.splitTargets = this.state.users.map(u=>u.id);
                    } else usersRef.set({list:DEFAULT_USERS});
                    if(this.state.activeTab === 'accounting' || this.state.activeTab === 'split') this.renderContent();
                });
            },

            fetchWeather: async function() {
                try {
                    const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=26.2124&longitude=127.6809&current=temperature_2m,weather_code&timezone=Asia%2FTokyo");
                    const d=await r.json();
                    if(d.current){
                        const el=document.getElementById('weather-widget');
                        if(el){
                            el.innerHTML=`<i data-lucide="sun" width="14" class="text-yellow-400"></i> 那霸 ${d.current.temperature_2m}°C`;
                            el.classList.remove('hidden');
                            if(window.lucide) lucide.createIcons();
                        }
                    }
                }catch(e){}
            },

            // 核心渲染
            renderAll: function() { this.renderHeader(); this.renderContent(); this.renderBottomNav(); if(window.lucide) lucide.createIcons(); },
            
            renderHeader: function() {
                const t = this.state.activeTab;
                const titleMap = {
                    'itinerary': {t:'2026 沖繩行', i:'moon', c:'text-yellow-300'},
                    'backup': {t:'預備行程', i:'folder-plus', c:'text-pink-400'},
                    'recommend': {t:'50選推薦', i:'thumbs-up', c:'text-blue-400'},
                    'split': {t:'智慧分帳', i:'divide-square', c:'text-amber-400'},
                    'accounting': {t:'雲端記帳', i:'wifi', c:'text-emerald-400'}
                };
                const curr = titleMap[t];
                document.getElementById('app-title').innerHTML = `<i data-lucide="${curr.i}" class="${curr.c}" width="20"></i> ${curr.t}`;
                
                // Export btn logic
                const eb = document.getElementById('btn-export');
                if(eb) eb.classList.toggle('hidden', t !== 'accounting');
            },

            renderBottomNav: function() {
                const tabs=['itinerary','backup','recommend','split','accounting'];
                const colors={itinerary:'text-indigo-400',backup:'text-pink-400',recommend:'text-blue-400',split:'text-amber-400',accounting:'text-emerald-400'};
                tabs.forEach(t => {
                    const b = document.getElementById(`tab-${t}`);
                    if(b) b.className = `flex-1 py-4 flex flex-col items-center gap-1 text-[10px] font-medium transition-colors ${this.state.activeTab===t ? colors[t] : 'text-slate-500'}`;
                });
            },

            renderContent: function() {
                const c = document.getElementById('main-content');
                if(!c) return;
                c.innerHTML = '';
                const t = this.state.activeTab;
                if(t === 'itinerary') renderItinerary(c);
                else if(t === 'backup') renderBackup(c);
                else if(t === 'recommend') renderRecommend(c);
                else if(t === 'split') renderSplit(c);
                else renderAccounting(c);
                if(window.lucide) lucide.createIcons();
            },

            // Actions
            switchTab: function(t) { this.state.activeTab=t; this.renderAll(); },
            toggleExpand: function(id) { this.state.expandedId = this.state.expandedId===id?null:id; this.renderContent(); },
            toggleExpandExpense: function(id) { this.state.expandedExpId = this.state.expandedExpId===id?null:id; this.renderContent(); },
            toggleConverter: function() { document.getElementById('converter-panel').classList.toggle('hidden'); },
            
            // --- INPUT HANDLERS (NO RE-RENDER) ---
            syncAmount: function(v) { this.state.formAmount=v; },
            syncNote: function(v) { this.state.formNote=v; },
            
            // 記帳功能
            setExpCat: function(c) { this.tempExpCat=c; this.renderContent(); },
            setExpCurr: function(c) { this.tempExpCurr=c; this.renderContent(); },
            selectUser: function(id) { this.state.selectedUser=id; this.renderContent(); },
            submitExpense: function(e) {
                e.preventDefault();
                const a=this.state.formAmount, n=this.state.formNote;
                if(!a){alert("請輸入金額");return;}
                let v=parseFloat(a);
                if(this.tempExpCurr==='TWD') v=Math.round(v*this.state.rate);
                this.addCloudExpense({amount:v, cat:this.tempExpCat, note:n, userId:this.state.selectedUser});
                this.state.formAmount=''; this.state.formNote=''; 
                this.renderContent();
            },
            deleteCloudExpense: function(id) { if(confirm("刪除?")) window.expensesRef.doc(id).delete(); },

            // 分帳功能 (Fixed)
            updateSplitCalc: function(val) {
                this.state.splitAmount = val;
                // 手動更新結果區，不重繪整個表單
                const d=document.getElementById('split-result');
                if(d) {
                    const amt=parseFloat(val);
                    if(amt && this.state.splitTargets.length>0) {
                        const pp = Math.round(amt / this.state.splitTargets.length);
                        const sym = this.state.splitCurrency==='TWD'?'NT$':'¥';
                        d.innerHTML = `<div class="text-center text-3xl font-bold text-amber-400 mb-2">每人 ${sym}${pp.toLocaleString()}</div><button onclick="app.submitSplit(${pp})" class="w-full bg-amber-600 text-white py-2 rounded font-bold">寫入記帳</button>`;
                    } else {
                        d.innerHTML = `<div class="text-center text-slate-500 py-2">輸入金額...</div>`;
                    }
                }
            },
            setSplitCurrency: function(c) { this.state.splitCurrency=c; this.renderContent(); },
            setSplitPayer: function(id) { this.state.splitPayer=id; if(!this.state.splitTargets.includes(id))this.state.splitTargets.push(id); this.renderContent(); },
            toggleSplitTarget: function(id) { 
                const i=this.state.splitTargets.indexOf(id); 
                if(i>-1)this.state.splitTargets.splice(i,1); else this.state.splitTargets.push(id); 
                this.renderContent();
                // Refocus
                const inp = document.getElementById('split-input');
                if(inp) { inp.value=this.state.splitAmount; inp.focus(); }
            },
            submitSplit: function(pp) {
                if(confirm('寫入記帳?')) {
                    const p = this.state.users.find(u=>u.id===this.state.splitPayer);
                    const tgs = this.state.users.filter(u=>this.state.splitTargets.includes(u.id)).map(u=>u.name).join(',');
                    let val = parseFloat(this.state.splitAmount);
                    let note = `分帳: 總${this.state.splitCurrency==='TWD'?'NT$':'¥'}${val} (${tgs})`;
                    if(this.state.splitCurrency==='TWD') val = Math.round(val * this.state.rate);
                    
                    this.addCloudExpense({amount:val, cat:'food', note:note, userId:this.state.splitPayer});
                    this.state.splitAmount=''; alert("完成"); this.renderContent();
                }
            },

            // CSV Export
            exportCSV: function() {
                if(this.state.expenses.length===0) {alert("無資料");return;}
                let c="\uFEFF日期,付款人,項目,日幣,台幣約,備註\n";
                this.state.expenses.forEach(e=>{
                    const d=new Date(e.timestamp).toLocaleDateString();
                    const u=this.state.users.find(x=>x.id===e.userId)?.name||'';
                    const cat=EXPENSE_CATEGORIES.find(x=>x.id===e.cat)?.name||'';
                    const t=Math.round(e.amount/this.state.rate);
                    c+=`${d},${u},${cat},${e.amount},${t},"${e.note||''}"\n`;
                });
                const b=new Blob([c],{type:'text/csv;charset=utf-8;'});
                const l=document.createElement("a");
                l.href=URL.createObjectURL(b); l.download="okinawa_2026.csv";
                document.body.appendChild(l); l.click(); document.body.removeChild(l);
            },

            // Cloud Wrappers
            addCloudExpense: async function(d){if(window.db)await expensesRef.add({...d,timestamp:Date.now()});},
            addCloudItinerary: async function(d,v){if(window.db)await itineraryRef.add({...v,dayIndex:d});},
            deleteCloudItin: async function(id){if(confirm("刪除?"))await itineraryRef.doc(id).delete();},
            addCloudBackup: async function(v){if(window.db)await backupRef.add({...v,timestamp:Date.now()});},
            deleteCloudBackup: async function(id){if(confirm("刪除?"))await backupRef.doc(id).delete();},
            
            // Convert Helper
            convertCurrency: function(t) {
                const j=document.getElementById('conv-jpy'), tw=document.getElementById('conv-twd');
                if(t==='jpy') tw.value=j.value?Math.round(j.value/this.state.rate):'';
                else j.value=tw.value?Math.round(tw.value*this.state.rate):'';
            },

            // 行程還原
            uploadDefaultItinerary: async function() {
                if(!confirm("確定上傳預設行程?")) return;
                const b=db.batch();
                window.DEFAULT_ITINERARY_EVENTS_SOURCE.forEach(d=>{
                    d.events.forEach(e=>{
                        const r=itineraryRef.doc();
                        b.set(r,{...e, dayIndex:d.dayIndex, timestamp:Date.now()});
                    });
                });
                b.commit().then(()=>alert("完成!"));
            }
        };

        // --- Data Constants ---
        const EXPENSE_CATEGORIES=[{id:'food',name:'餐飲',icon:'utensils',color:'bg-orange-500'},{id:'transport',name:'交通',icon:'bus',color:'bg-blue-500'},{id:'shopping',name:'購物',icon:'shopping-bag',color:'bg-pink-500'},{id:'ticket',name:'門票',icon:'ticket',color:'bg-purple-500'},{id:'hotel',name:'住宿',icon:'home',color:'bg-indigo-500'},{id:'other',name:'其他',icon:'more-horizontal',color:'bg-gray-500'}];
        const DAYS_STRUCTURE=[{date:"Day 1 (5/25)",title:"虎航早班機 & 美國村",icon:"plane"},{date:"Day 2 (5/26)",title:"藍洞浮潛 & 頂級燒肉",icon:"sun"},{date:"Day 3 (5/27)",title:"北部風光 & 居酒屋",icon:"map-pin"},{date:"Day 4 (5/28)",title:"購物日 & 唐吉訶德",icon:"shopping-bag"},{date:"Day 5 (5/29)",title:"南部悠閒 & 牛排宵夜",icon:"coffee"},{date:"Day 6 (5/30)",title:"Outlet & 機場免稅",icon:"plane"}];
        const DEFAULT_USERS=[{id:'u1',name:'旅客 A',color:'bg-blue-500',text:'text-blue-400',border:'border-blue-500'},{id:'u2',name:'旅客 B',color:'bg-pink-500',text:'text-pink-400',border:'border-pink-500'},{id:'u3',name:'旅客 C',color:'bg-amber-500',text:'text-amber-400',border:'border-amber-500'},{id:'u4',name:'旅客 D',color:'bg-emerald-500',text:'text-emerald-400',border:'border-emerald-500'}];
        
        // Renderers
        function renderItinerary(c) {
            if(app.state.itineraryEvents.length===0) {
                c.innerHTML=`<div class="bg-slate-800 p-6 rounded-xl text-center border border-slate-700 mt-8"><i data-lucide="cloud-off" class="mx-auto text-slate-500 mb-2" width="48"></i><div class="text-white font-bold mb-2">行程是空的</div><button onclick="app.uploadDefaultItinerary()" class="bg-indigo-600 text-white px-4 py-2 rounded">上傳預設行程</button></div>`;
                return;
            }
            DAYS_STRUCTURE.forEach((d,i)=>{
                const evs = app.state.itineraryEvents.filter(e=>e.dayIndex===i).sort((a,b)=>a.time.localeCompare(b.time));
                let h = evs.map(e=>`<div class="flex items-center gap-3 p-3 border-b border-slate-700/50 hover:bg-slate-700/30"><div class="w-12 text-right text-sm font-mono text-indigo-400 font-bold">${e.time}</div><div class="flex-1"><div class="text-sm font-bold text-slate-200">${e.title}</div><div class="text-xs text-slate-500">${e.note}</div></div><button onclick="app.deleteCloudItin('${e.id}')" class="text-slate-600 hover:text-red-400"><i data-lucide="trash-2" width="14"></i></button></div>`).join('');
                const card = document.createElement('div');
                card.className = "bg-[#1e293b] rounded-xl border border-slate-700/60 overflow-hidden mb-4";
                card.innerHTML = `<div class="bg-slate-800 px-4 py-2 border-b border-slate-700 flex justify-between items-center"><span class="font-bold text-indigo-100">${d.date}</span><button onclick="showAddItinModal(${i})" class="text-indigo-400"><i data-lucide="plus-circle" width="18"></i></button></div><div>${h||'<div class="p-3 text-center text-xs text-slate-500">無行程</div>'}</div>`;
                c.appendChild(card);
            });
        }

        function renderBackup(c) {
            const lst = app.state.backupEvents.map(e=>`<div class="p-3 bg-slate-800 rounded mb-2 border border-slate-700 flex justify-between items-center"><div><div class="font-bold text-sm text-slate-200">${e.title}</div><div class="text-xs text-slate-500">${e.note}</div></div><button onclick="app.deleteCloudBackup('${e.id}')" class="text-slate-600 hover:text-red-400"><i data-lucide="trash-2" width="14"></i></button></div>`).join('');
            c.innerHTML = `<div class="mb-4 flex gap-2"><input id="bk-title" placeholder="景點" class="bg-slate-800 border border-slate-600 rounded p-2 text-sm w-1/2"><input id="bk-note" placeholder="備註" class="bg-slate-800 border border-slate-600 rounded p-2 text-sm w-1/2"><button onclick="submitBackup()" class="bg-pink-600 text-white px-3 rounded"><i data-lucide="plus" width="16"></i></button></div><div>${lst||'<div class="text-center text-slate-500 text-sm">無備案</div>'}</div>`;
        }

        const REC_SPOTS=[{title:"美麗海水族館",tag:"北部"},{title:"古宇利島",tag:"北部"},{title:"美國村",tag:"中部"},{title:"萬座毛",tag:"中部"},{title:"國際通",tag:"南部"},{title:"瀨長島",tag:"南部"},{title:"暖暮拉麵",tag:"美食"},{title:"燒肉敘敘苑",tag:"美食"},{title:"Parco City",tag:"購物"},{title:"唐吉訶德",tag:"購物"}];
        function renderRecommend(c) {
            const h = REC_SPOTS.map(s=>`<div class="bg-slate-800 rounded p-3 border border-slate-700 flex justify-between items-center"><div><div class="font-bold text-sm text-slate-200">${s.title}</div><div class="text-xs text-blue-400 bg-blue-900/30 px-1.5 py-0.5 rounded inline-block mt-1">${s.tag}</div></div><button onclick="app.addCloudBackup({title:'${s.title}',tag:'${s.tag}',note:'推薦',timestamp:Date.now()});alert('已加入')" class="bg-slate-700 hover:bg-blue-600 text-white p-1.5 rounded"><i data-lucide="plus" width="14"></i></button></div>`).join('');
            c.innerHTML = `<div class="grid grid-cols-2 gap-3">${h}</div>`;
        }

        function renderSplit(c) {
            const u = app.state.users;
            const isTwd = app.state.splitCurrency === 'TWD';
            
            c.innerHTML = `
                <div class="bg-slate-800 rounded-xl p-5 border border-slate-700">
                    <div class="flex gap-2 mb-4">
                        <input type="number" id="split-input" value="${app.state.splitAmount}" oninput="app.updateSplitCalc(this.value)" class="w-2/3 bg-slate-900 border border-slate-600 rounded p-3 text-xl text-center text-white outline-none focus:border-amber-500" placeholder="總金額">
                        <div class="w-1/3 flex bg-slate-900 rounded border border-slate-600 p-1">
                            <button onclick="app.setSplitCurrency('JPY')" class="flex-1 rounded text-xs ${!isTwd?'bg-amber-600 text-white':'text-slate-400'}">日幣</button>
                            <button onclick="app.setSplitCurrency('TWD')" class="flex-1 rounded text-xs ${isTwd?'bg-indigo-600 text-white':'text-slate-400'}">台幣</button>
                        </div>
                    </div>
                    <div class="space-y-3">
                        <div>
                            <div class="text-xs text-slate-400 mb-1">付款人</div>
                            <div class="flex gap-2 overflow-x-auto pb-1">${u.map(x=>`<button onclick="app.setSplitPayer('${x.id}')" class="px-3 py-2 rounded text-xs whitespace-nowrap transition-colors ${app.state.splitPayer===x.id?`${x.color} text-white`:'bg-slate-700 text-slate-400'}">${x.name}</button>`).join('')}</div>
                        </div>
                        <div>
                            <div class="text-xs text-slate-400 mb-1">分攤對象</div>
                            <div class="grid grid-cols-2 gap-2">${u.map(x=>{const sel=app.state.splitTargets.includes(x.id); return `<button onclick="app.toggleSplitTarget('${x.id}')" class="py-2 rounded text-xs border ${sel?'bg-slate-600 text-white border-amber-500':'bg-slate-700 text-slate-500 border-transparent'}">${x.name} ${sel?'✓':''}</button>`}).join('')}</div>
                        </div>
                    </div>
                    <div id="split-result" class="mt-4"></div>
                </div>
            `;
            // Trigger calc
            app.updateSplitCalc(app.state.splitAmount);
        }

        function renderAccounting(c) {
            // Summary
            const total = app.state.expenses.reduce((s,i)=>s+i.amount,0);
            const twd = Math.round(total/app.state.rate);
            
            const usersHtml = app.state.users.map(u=>`<div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full ${u.color} flex items-center justify-center text-white font-bold text-xs shadow">${u.name[0]}</div><div class="text-[10px] mt-1 text-slate-400">${u.name}</div></div>`).join('');
            
            const isJpy = app.tempExpCurr==='JPY';
            const cats = EXPENSE_CATEGORIES.map(x=>`<button onclick="app.setExpCat('${x.id}')" class="flex flex-col items-center gap-1 p-2 rounded ${app.tempExpCat===x.id?'bg-slate-700 ring-1 ring-emerald-500':''}"><div class="${x.color} text-white p-1.5 rounded-full"><i data-lucide="${x.icon}" width="14"></i></div><span class="text-[10px] text-slate-400">${x.name}</span></button>`).join('');

            // List
            const list = app.state.expenses.map(e=>{
                const u = app.state.users.find(x=>x.id===e.userId)||DEFAULT_USERS[0];
                const cat = EXPENSE_CATEGORIES.find(x=>x.id===e.cat)||EXPENSE_CATEGORIES[0];
                const isEx = app.state.expandedExpId === e.id;
                return `<div onclick="app.toggleExpandExpense('${e.id}')" class="bg-slate-800 border-l-4 ${u.border} rounded mb-2 overflow-hidden"><div class="p-3 flex items-center gap-3"><div class="${cat.color} p-2 rounded-full text-white"><i data-lucide="${cat.icon}" width="16"></i></div><div class="flex-1"><div class="flex justify-between"><span class="text-sm font-bold text-slate-200">${e.note||cat.name}</span><span class="font-mono text-white">¥${e.amount}</span></div><div class="text-[10px] text-slate-500 flex justify-between mt-1"><span>${u.name}</span><span>≈ NT$${Math.round(e.amount/app.state.rate)}</span></div></div></div>${isEx?`<div class="bg-slate-900/30 p-2 text-right"><button onclick="event.stopPropagation();app.deleteCloudExpense('${e.id}')" class="text-xs text-red-400 flex items-center justify-end gap-1"><i data-lucide="trash-2" width="12"></i> 刪除</button></div>`:''}</div>`;
            }).join('');

            c.innerHTML = `
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-4"><div class="text-center"><div class="text-3xl font-bold text-white">¥${total.toLocaleString()}</div><div class="text-xs text-slate-400">約 NT$ ${twd.toLocaleString()}</div></div><div class="grid grid-cols-4 gap-2 mt-4 border-t border-slate-700 pt-3">${usersHtml}</div></div>
                
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-4">
                    <div class="flex gap-2 mb-3">
                        <div class="w-2/3 relative"><input type="number" id="amt-in" value="${app.state.formAmount}" oninput="app.syncAmount(this.value)" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white text-lg outline-none focus:border-emerald-500" placeholder="0"><span class="absolute right-2 top-3 text-xs text-slate-500">${app.tempExpCurr}</span></div>
                        <div class="w-1/3 flex bg-slate-900 rounded border border-slate-600 p-1"><button onclick="app.setExpCurr('JPY')" class="flex-1 text-xs rounded ${isJpy?'bg-emerald-600 text-white':'text-slate-400'}">日</button><button onclick="app.setExpCurr('TWD')" class="flex-1 text-xs rounded ${!isJpy?'bg-indigo-600 text-white':'text-slate-400'}">台</button></div>
                    </div>
                    <div class="grid grid-cols-6 gap-1 mb-3">${cats}</div>
                    <div class="flex gap-2"><input id="note-in" value="${app.state.formNote}" oninput="app.syncNote(this.value)" placeholder="備註" class="flex-1 bg-slate-900 border border-slate-600 rounded px-3 text-sm text-white outline-none"><button onclick="app.submitExpense()" class="bg-emerald-600 text-white p-2.5 rounded shadow"><i data-lucide="plus" width="20"></i></button></div>
                </div>
                
                <div>${list}</div>
            `;
        }

        // Modal Wrappers for Itinerary Adding
        window.showAddItinModal = (d) => {
            const t = prompt("時間 (如 10:00)"); if(!t)return;
            const tt = prompt("標題"); if(!tt)return;
            const n = prompt("備註");
            app.addCloudItinerary(d, {time:t, title:tt, note:n||'', cost:'', mapUrl:tt, imgKey:'default'});
        };
        
        // Backup Handlers
        window.submitBackup = () => {
            const t = document.getElementById('bk-title').value;
            const n = document.getElementById('bk-note').value;
            if(t) { app.addCloudBackup({title:t, tag:'自訂', note:n, timestamp:Date.now()}); }
        };

        // Data Sources (Full Restore)
        window.DEFAULT_ITINERARY_EVENTS_SOURCE = [
            {dayIndex:0, events:[{time:"09:20",title:"抵達那霸機場 & 取車",note:"預計出關+取車約1.5小時",cost:"租車費",imgKey:"airport"},{time:"11:30",title:"糸滿魚市場",note:"海鮮生魚片",cost:"¥2000",imgKey:"market"},{time:"15:30",title:"Snoopy Surf Shop",note:"美國村",cost:"",imgKey:"american-village"},{time:"20:00",title:"美國村夜景",note:"日落步道",cost:"",imgKey:"night-view"}]},
            {dayIndex:1, events:[{time:"08:00",title:"青之洞窟浮潛",note:"真榮田岬",cost:"¥4000",imgKey:"snorkeling"},{time:"11:30",title:"Pizzeria da ENZO",note:"窯烤披薩",cost:"¥2000",imgKey:"pizza"},{time:"19:00",title:"琉球之牛",note:"頂級燒肉",cost:"¥8000",imgKey:"beef"}]},
            {dayIndex:2, events:[{time:"11:00",title:"古宇利大橋",note:"心形岩",cost:"",imgKey:"bridge"},{time:"14:00",title:"美麗海水族館",note:"黑潮之海",cost:"¥2180",imgKey:"aquarium"},{time:"19:00",title:"阿古豬涮涮鍋",note:"恩納豚",cost:"¥4000",imgKey:"food-taco"}]},
            {dayIndex:3, events:[{time:"11:00",title:"PARCO CITY",note:"最大百貨",cost:"",imgKey:"parco"},{time:"20:30",title:"唐吉訶德",note:"國際通24H",cost:"",imgKey:"donki"}]},
            {dayIndex:4, events:[{time:"09:30",title:"波上宮",note:"海邊神社",cost:"¥800",imgKey:"shrine"},{time:"14:00",title:"壺屋通",note:"文青下午茶",cost:"¥1000",imgKey:"coffee"},{time:"22:00",title:"傑克牛排",note:"美式復古",cost:"¥2500",imgKey:"beef"}]},
            {dayIndex:5, events:[{time:"11:00",title:"Ashibinaa Outlet",note:"最後購物",cost:"",imgKey:"outlet"},{time:"15:00",title:"iias 豐崎",note:"DMM水族館",cost:"",imgKey:"parco"},{time:"19:40",title:"那霸機場",note:"返台",cost:"",imgKey:"airport"}]}
        ];

        window.onload();
    </script>
</body>
